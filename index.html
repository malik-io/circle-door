<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Circle — Door</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
  main { text-align: center; padding: 2rem; max-width: 32rem; }
  a { color: #7ee787; font-size: 1.15rem; word-break: break-all; }
  .note { color: #8b949e; margin-top: 1rem; line-height: 1.5; }
  button { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
           border-radius: 6px; padding: .6rem 1.2rem; font-size: 1rem; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <h1>🍀 The Circle</h1>
  <p id="status">Opening the door…</p>
  <p><a id="door" href="#" style="display:none">Enter the Circle →</a></p>
  <p class="note" id="note" style="display:none">
    The door is being re-lit — the tunnel address just changed.
    Wait a minute, then tap retry.
  </p>
  <button id="retry" style="display:none" onclick="location.reload()">Retry</button>
</main>
<script>
  fetch('door.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      if (!d.url) throw new Error('no url');
      var a = document.getElementById('door');
      a.href = d.url; a.style.display = 'inline';
      document.getElementById('status').textContent = 'Door found — come on in:';
      location.replace(d.url);
    })
    .catch(function () {
      document.getElementById('status').textContent = 'The door is being re-lit.';
      document.getElementById('note').style.display = 'block';
      document.getElementById('retry').style.display = 'inline-block';
    });
</script>
</body>
</html>
